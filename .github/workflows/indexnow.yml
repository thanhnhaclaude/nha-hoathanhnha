# Mỗi sáng sau giờ đăng bài (08:00 VN): báo Bing, Yandex… các URL mới hoặc vừa đổi trong sitemap.
# Google không nhận IndexNow và không có API gửi URL cho bài thường: Google tự đọc sitemap.
name: Báo IndexNow URL mới

on:
  schedule:
    - cron: "30 1 * * *" # 08:30 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npx --yes tsx scripts/indexnow.ts --recent
